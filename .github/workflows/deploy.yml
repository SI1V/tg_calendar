name: Build image

on:
  push:
    branches: [master]

# Собираем образ и пушим в registry.
# ДЕПЛОЙ НА КЛАСТЕР БОЛЬШЕ НЕ ЗДЕСЬ: единая точка — репа si1v-lab/k8s-cluster.
# После сборки обнови tag образа в k8s-cluster/apps/tg-calendar/bot.yaml
#   и запушь k8s-cluster — тогда под обновится на новую версию.

env:
  IMAGE_NAME: tg-calendar

jobs:
  build:
    runs-on: [self-hosted, vdsina]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & push image
        run: |
          BUILD=$(date +%Y%m%d-%H%M%S)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          IMAGE=10.43.169.20:5000/${{ env.IMAGE_NAME }}
          docker build -f Dockerfile -t $IMAGE:$BUILD -t $IMAGE:latest .
          docker push $IMAGE:$BUILD
          docker push $IMAGE:latest
          echo "Собран образ: $IMAGE:$BUILD"
          echo "Обнови tag в k8s-cluster/apps/tg-calendar/bot.yaml на $BUILD"

      - name: Notify on failure
        if: failure()
        run: echo "!! Сборка упала — смотри логи выше"
